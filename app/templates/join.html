<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join {{ project.name }}</title><link rel="stylesheet" href="/static/app.css?v={{ version }}"></head>
<body data-page="join" data-project-id="{{ project.id }}" data-token="{{ token }}"><main class="join-shell"><div class="join-card"><div class="eyebrow">JOIN PROJECT</div><h1>{{ project.name }}</h1><p>{{ project.description }}</p><form id="joinForm" class="form-stack"><label>Your name<input name="display_name" required maxlength="100" autofocus></label><label>PIN <span class="muted">(if the organizer set one)</span><input name="pin" inputmode="numeric" autocomplete="one-time-code"></label><button class="btn" type="submit">Join project</button></form><p class="microcopy">This project uses a secure browser cookie after you join. The invite link is not your long-term login credential.</p></div></main><div id="toast" class="toast"></div><script src="/static/app.js?v={{ version }}"></script></body></html>
