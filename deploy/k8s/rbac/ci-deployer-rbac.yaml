apiVersion: v1
kind: ServiceAccount
metadata:
  name: cocklebur-ci-deployer
  namespace: cocklebur-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cocklebur-deployer-role
  namespace: cocklebur-app
rules:
  # 核心資源：管理 Service, ConfigMap, Secret, PVC
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允許綁定 imagePullSecrets 至 default ServiceAccount
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "patch", "update"]
  # 應用程式工作負載：管理 Deployment
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 網路路由：管理 Ingress
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 憑證管理：管理 Certificate
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cocklebur-deployer-binding
  namespace: cocklebur-app
subjects:
  - kind: ServiceAccount
    name: cocklebur-ci-deployer
    namespace: cocklebur-app
roleRef:
  kind: Role
  name: cocklebur-deployer-role
  apiGroup: rbac.authorization.k8s.io
