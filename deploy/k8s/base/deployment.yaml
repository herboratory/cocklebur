apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocklebur-server
  labels:
    app.kubernetes.io/name: cocklebur-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Cocklebur is file-backed (SQLite/files on PV). Recreate strategy is mandatory
  # to avoid multiple pods mounting the same ReadWriteOnce PV simultaneously.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cocklebur-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cocklebur-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cocklebur-server
          image: cocklebur-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cocklebur-config
            - secretRef:
                name: cocklebur-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: cocklebur-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: cocklebur-data
          persistentVolumeClaim:
            claimName: cocklebur-data
